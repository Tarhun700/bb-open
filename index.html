<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Открыть тред в bb</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #1c1c1e;
    }

    * { box-sizing: border-box; }

    body {
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: 24px;
      place-items: center;
    }

    main {
      width: min(100%, 28rem);
      padding: 28px;
      border: 1px solid #d1d1d6;
      border-radius: 20px;
      background: #fff;
      text-align: center;
    }

    h1 { margin: 0 0 12px; font-size: clamp(1.5rem, 6vw, 2rem); }
    p { margin: 0 0 24px; color: #636366; line-height: 1.5; }

    a {
      display: block;
      width: 100%;
      min-height: 52px;
      padding: 15px 18px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.35;
      text-decoration: none;
    }

    a[hidden] { display: none; }
    a:focus-visible { outline: 3px solid #0a84ff; outline-offset: 3px; }
    #app-link { background: #0a84ff; color: #fff; }
    #web-link { margin-top: 12px; color: #0066cc; }

    @media (prefers-color-scheme: dark) {
      :root { background: #111113; color: #f5f5f7; }
      main { border-color: #3a3a3c; background: #1c1c1e; }
      p { color: #aeaeb2; }
      #web-link { color: #64aaff; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Открыть тред в bb</h1>
    <p id="status">Открываем тред…</p>
    <a id="app-link" href="#" hidden>Открыть в приложении bb</a>
    <a id="web-link" href="#" hidden>Открыть в браузере</a>
  </main>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const threadId = params.get("t");
      const host = params.get("h") ?? "nicode.getbb.app";
      const status = document.getElementById("status");

      if (!threadId || !/^thr_[a-z0-9]{6,40}$/.test(threadId) || !/^[a-z0-9-]{1,63}\.getbb\.app$/.test(host)) {
        status.textContent = "Неверная ссылка";
        return;
      }

      const web = `https://${host}/threads/${threadId}`;
      const target = /Android/i.test(navigator.userAgent)
        ? `intent://${host}/threads/${threadId}#Intent;scheme=https;package=app.getbb.mobile;S.browser_fallback_url=${encodeURIComponent(web)};end`
        : web;
      const appLink = document.getElementById("app-link");
      const webLink = document.getElementById("web-link");
      appLink.href = target;
      webLink.href = web;
      appLink.hidden = false;
      webLink.hidden = false;

      location.replace(target);
    })();
  </script>
</body>
</html>
